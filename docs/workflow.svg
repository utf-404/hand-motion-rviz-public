<svg xmlns="http://www.w3.org/2000/svg" width="740" height="418" viewBox="0 0 740 418" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">Live hand motion workflow</title>
  <desc id="workflow-description">A webcam supplies frames to MediaPipe. The tracker sends hand poses over TCP as JSON Lines to the ROS 2 hand bridge. The joint_states topic carries 36 joint angles at about 30 hertz. RViz2 reads the transforms produced by robot_state_publisher, and Isaac Sim subscribes to joint_states directly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#8bb2d6"/>
    </marker>
  </defs>

  <rect x=".5" y=".5" width="739" height="417" rx="20" fill="#0e1828" stroke="#34465d"/>

  <g fill="none" stroke="#8bb2d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 59H424" marker-end="url(#arrow)"/>
    <path d="M544 91v34H370v17" marker-end="url(#arrow)"/>
    <path d="M370 212v23" marker-end="url(#arrow)"/>
    <path d="M370 297v19H196v17" marker-end="url(#arrow)"/>
    <path d="M370 316h174v17" marker-end="url(#arrow)"/>
  </g>

  <g fill="#17263a" stroke="#3d5572" stroke-width="1.5">
    <rect x="82" y="27" width="228" height="64" rx="12"/>
    <rect x="430" y="27" width="228" height="64" rx="12"/>
    <rect x="82" y="338" width="228" height="54" rx="12"/>
    <rect x="430" y="338" width="228" height="54" rx="12"/>
  </g>
  <rect x="234" y="147" width="272" height="65" rx="12" fill="#164041" stroke="#62d8c2" stroke-width="1.5"/>
  <rect x="234" y="240" width="272" height="57" rx="12" fill="#17263a" stroke="#3d5572" stroke-width="1.5"/>

  <g fill="none" stroke="#93c6eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(108 47)">
      <rect x="0" y="3" width="30" height="18" rx="4"/>
      <circle cx="15" cy="12" r="4"/>
      <path d="M12 25h6m-3-4v4"/>
    </g>
    <g transform="translate(455 45)">
      <path d="m6 19 2-6 2-8 3-4m-3 4 5-2 3-3m-3 3 6 2 4-3m-4 3 4 5 4-2m-4 2v6l-6 7H9Z"/>
      <circle cx="8" cy="13" r="2" fill="#17263a"/>
      <circle cx="19" cy="23" r="2" fill="#17263a"/>
    </g>
    <g transform="translate(108 353)">
      <rect x="0" y="2" width="30" height="19" rx="3"/>
      <path d="M11 26h8m-4-5v5m-6-10 5-6 7 3"/>
    </g>
    <g transform="translate(455 352)">
      <path d="m1 7 13-6 13 6v13l-13 6-13-6Zm0 0 13 6 13-6m-13 6v13"/>
    </g>
  </g>

  <g fill="#f2f7ff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="650" font-size="25">
    <text x="151" y="67">Webcam</text>
    <text x="499" y="57">MediaPipe</text>
    <text x="151" y="362">RViz2</text>
    <text x="499" y="362">Isaac Sim</text>
  </g>
  <g fill="#c4d7ec" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">
    <text x="499" y="78">Hand tracking</text>
    <text x="451" y="115" text-anchor="middle" font-size="18" font-weight="600">TCP · JSON Lines</text>
    <text x="370" y="199" text-anchor="middle">ROS 2</text>
    <text x="370" y="283" text-anchor="middle">36 joints · ~30 Hz</text>
    <text x="151" y="383" font-size="17">via ROS TF</text>
    <text x="499" y="383" font-size="17">Reads JointState</text>
  </g>
  <g fill="#f2f7ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" text-anchor="middle" font-weight="650">
    <text x="370" y="175" font-size="25">hand_bridge</text>
    <text x="370" y="262" font-size="22">/joint_states</text>
  </g>
</svg>
